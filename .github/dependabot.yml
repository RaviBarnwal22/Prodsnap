version: 2
updates:
  # Weekly PRs for vulnerable or outdated npm packages. Security fixes like the
  # Next.js remote code execution patch arrive as their own PRs regardless.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
